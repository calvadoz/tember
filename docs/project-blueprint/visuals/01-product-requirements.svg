<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Tember product requirements at a glance</title><desc id="desc">A visual summary of users, core value, features, and release measures.</desc>
  <rect width="1200" height="675" fill="#fff9ed"/><path d="M0 0h1200v144H0z" fill="#173f2d"/><path d="M928 0c-46 83-37 129 51 144h221V0z" fill="#a9c99d" opacity=".75"/>
  <text x="72" y="63" fill="#d7e8d0" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="3">TEMBER · PROJECT BLUEPRINT</text>
  <text x="72" y="116" fill="#fff9ed" font-family="Montserrat,Arial,sans-serif" font-size="42" font-weight="800">01 / Product requirements</text>
  <text x="72" y="190" fill="#173f2d" font-family="Montserrat,Arial,sans-serif" font-size="27" font-weight="800">A private growth journal that stays useful offline.</text>
  <text x="72" y="221" fill="#496657" font-family="Inter,Arial,sans-serif" font-size="18">Tember protects the small details that make a pet’s history worth keeping.</text>
  <rect x="72" y="260" width="320" height="170" rx="20" fill="#ffffff" stroke="#dce8d6" stroke-width="2"/><text x="98" y="302" fill="#b85d40" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" letter-spacing="2">WHO IT SERVES</text><text x="98" y="342" fill="#173f2d" font-family="Montserrat,Arial,sans-serif" font-size="22" font-weight="800">Caregivers</text><text x="98" y="371" fill="#496657" font-family="Inter,Arial,sans-serif" font-size="17">Record and understand</text><text x="98" y="395" fill="#496657" font-family="Inter,Arial,sans-serif" font-size="17">one pet’s story.</text>
  <rect x="420" y="260" width="320" height="170" rx="20" fill="#f1f7ec" stroke="#cfe1c8" stroke-width="2"/><text x="446" y="302" fill="#b85d40" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" letter-spacing="2">CORE PROMISE</text><text x="446" y="342" fill="#173f2d" font-family="Montserrat,Arial,sans-serif" font-size="22" font-weight="800">Local by default</text><text x="446" y="371" fill="#496657" font-family="Inter,Arial,sans-serif" font-size="17">Fast device access,</text><text x="446" y="395" fill="#496657" font-family="Inter,Arial,sans-serif" font-size="17">with optional household sync.</text>
  <rect x="768" y="260" width="360" height="170" rx="20" fill="#fff2df" stroke="#f0d3aa" stroke-width="2"/><text x="794" y="302" fill="#b85d40" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" letter-spacing="2">SAFE BOUNDARY</text><text x="794" y="342" fill="#173f2d" font-family="Montserrat,Arial,sans-serif" font-size="22" font-weight="800">Facts, not diagnosis</text><text x="794" y="371" fill="#496657" font-family="Inter,Arial,sans-serif" font-size="17">No health claims, advice,</text><text x="794" y="395" fill="#496657" font-family="Inter,Arial,sans-serif" font-size="17">billing, or cloud-only records.</text>
  <text x="72" y="493" fill="#173f2d" font-family="Montserrat,Arial,sans-serif" font-size="22" font-weight="800">Release signals</text>
  <line x1="72" y1="516" x2="1128" y2="516" stroke="#d9e6d3" stroke-width="2"/>
  <circle cx="91" cy="559" r="10" fill="#a9c99d"/><text x="115" y="566" fill="#173f2d" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">Valid data</text><text x="115" y="592" fill="#496657" font-family="Inter,Arial,sans-serif" font-size="16">Positive weight. Optional dimensions remain absent.</text>
  <circle cx="476" cy="559" r="10" fill="#d78b5c"/><text x="500" y="566" fill="#173f2d" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">Resilient sync</text><text x="500" y="592" fill="#496657" font-family="Inter,Arial,sans-serif" font-size="16">A failed upload remains safely pending.</text>
  <circle cx="838" cy="559" r="10" fill="#173f2d"/><text x="862" y="566" fill="#173f2d" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">Mobile integrity</text><text x="862" y="592" fill="#496657" font-family="Inter,Arial,sans-serif" font-size="16">Core journeys fit 320–768px.</text>
  <text x="72" y="640" fill="#6c826f" font-family="Inter,Arial,sans-serif" font-size="14">Tember blueprint · editable source: 01-product-requirements.md</text>
</svg>
