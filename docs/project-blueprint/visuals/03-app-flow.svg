  <path d="M756 487h-107" stroke="#d78b5c" stroke-width="5"/><path d="M655 477l-18 10 18 10z" fill="#d78b5c"/><rect x="76" y="429" width="561" height="116" rx="18" fill="#f1f7ec" stroke="#cfe1c8" stroke-width="2"/><text x="106" y="476" fill="#173f2d" font-family="Montserrat,Arial,sans-serif" font-size="20" font-weight="800">No connection or upload failure</text><text x="106" y="507" fill="#496657" font-family="Inter,Arial,sans-serif" font-size="16">Keep the device record safe. Keep it pending. Offer Sync now.</text>
