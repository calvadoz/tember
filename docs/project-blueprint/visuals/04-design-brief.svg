<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Tember design brief at a glance</title><desc id="desc">A visual summary of the Tember visual system, responsive rules, and accessibility priorities.</desc>
  <rect width="1200" height="675" fill="#fff9ed"/><path d="M0 0h1200v144H0z" fill="#173f2d"/><circle cx="1100" cy="26" r="140" fill="#fff2df" opacity=".9"/>
  <text x="72" y="63" fill="#d7e8d0" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="3">TEMBER · PROJECT BLUEPRINT</text><text x="72" y="116" fill="#fff9ed" font-family="Montserrat,Arial,sans-serif" font-size="42" font-weight="800">04 / Design brief</text>
  <text x="72" y="198" fill="#173f2d" font-family="Montserrat,Arial,sans-serif" font-size="27" font-weight="800">Steady care, warm clarity, no visual noise.</text>
  <text x="72" y="235" fill="#496657" font-family="Inter,Arial,sans-serif" font-size="18">Forest-and-cream character with generous space for the information that matters.</text>
  <text x="72" y="298" fill="#173f2d" font-family="Montserrat,Arial,sans-serif" font-size="21" font-weight="800">Colour roles</text>
  <circle cx="104" cy="345" r="28" fill="#173f2d"/><circle cx="182" cy="345" r="28" fill="#a9c99d"/><circle cx="260" cy="345" r="28" fill="#d78b5c"/><circle cx="338" cy="345" r="28" fill="#fff9ed" stroke="#d9e6d3" stroke-width="3"/><text x="72" y="395" fill="#496657" font-family="Inter,Arial,sans-serif" font-size="16">forest · sage · coral-gold · warm cream</text>
  <rect x="493" y="270" width="300" height="195" rx="22" fill="#ffffff" stroke="#dce8d6" stroke-width="2"/><text x="521" y="315" fill="#b85d40" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" letter-spacing="2">TYPE + HIERARCHY</text><text x="521" y="354" fill="#173f2d" font-family="Montserrat,Arial,sans-serif" font-size="29" font-weight="800">Pet’s latest weight</text><text x="521" y="388" fill="#496657" font-family="Inter,Arial,sans-serif" font-size="17">Montserrat for key moments.</text><text x="521" y="416" fill="#496657" font-family="Inter,Arial,sans-serif" font-size="17">Inter for interface and detail.</text>
  <rect x="825" y="252" width="303" height="213" rx="22" fill="#f1f7ec" stroke="#cfe1c8" stroke-width="2"/><text x="976" y="299" fill="#b85d40" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" letter-spacing="2" text-anchor="middle">RESPONSIVE FIRST</text><rect x="858" y="326" width="76" height="96" rx="10" fill="#173f2d"/><rect x="960" y="326" width="132" height="96" rx="11" fill="#ffffff" stroke="#173f2d" stroke-width="3"/><text x="976" y="447" fill="#496657" font-family="Inter,Arial,sans-serif" font-size="15" text-anchor="middle">20px mobile · contained wide content</text>
  <rect x="72" y="516" width="1056" height="74" rx="18" fill="#173f2d"/><text x="102" y="548" fill="#d7e8d0" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" letter-spacing="2">ACCESSIBILITY IS THE VISUAL SYSTEM</text><text x="102" y="575" fill="#fff9ed" font-family="Inter,Arial,sans-serif" font-size="18">AA contrast · visible focus · 44px targets · keyboard charts · reduced motion · text with every status colour</text>
